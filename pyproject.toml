[project]
name = "hcml"
version = "0.1.0"
description = "Demographic Bias in Face Recognition across Image Perturbations"
readme = "README.md"
authors = [
  {name = "Meng Wei", email = "meng.wei@stud.tu-darmstadt.de"},
  {name = "Nico Zeitz", email = "nico.zeitz@stud.tu-darmstadt.de"},
]
requires-python = ">=3.13"
dependencies = [
    "kornia>=0.8.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "pyright>=1.1.411",
    "ruff>=0.15.19",
]
